name: Build Kin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Briefcase
        run: pip install briefcase

      - name: Create Kin project
        run: |
          briefcase new <<EOF
          Kin
          kin
          org.savant
          Kin
          Kin Assistant
          Savant
          savnt@kin.app
          https://kin.app
          1
          4
          EOF

      - name: Build APK
        run: |
          briefcase build android --no-input

      - name: Upload APK
        uses: actions/upload-artifact@v4 
        with:
          name: Kin-APK
          path: **/app-debug.apk

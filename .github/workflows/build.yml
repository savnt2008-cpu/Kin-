name: Build Kin APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Briefcase
        run: pip install briefcase
      - name: Create Kin project
        run: printf 'Kin\nkin\norg.savant\nKin\nKin Assistant\nSavant\nsavnt@kin.app\nhttps://kin.app\n1\n1\n' | briefcase new
      - name: Copy Kin app code
        run: cp app.py kin/src/kin/app.py
      - name: Build APK
        run: cd kin && briefcase build android --no-input
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kin-APK
          path: kin/build/kin/android/gradle/app/build/outputs/apk/debug/app-debug.apk
